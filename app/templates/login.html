{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<div class="cartao cartao--estreito">
  <header class="cartao__cabecalho">
    <img class="cartao__logo"
         src="{{ url_for('static', filename='img/logo-terras-de-artemis.jpg') }}"
         alt="Logotipo do Residencial Terras de Ártemis"
         width="304" height="304">
    <h1>Controle de Encomendas</h1>
    <p class="subtitulo">Residencial Terras de Ártemis</p>
  </header>

  <form method="post" action="{{ url_for('auth.login') }}" novalidate>
    <div class="campo">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" value="{{ email }}"
             autocomplete="username" required autofocus>
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha"
             autocomplete="current-password" required>
    </div>

    <button type="submit" class="botao botao--primario">Entrar</button>
  </form>
</div>
{% endblock %}
